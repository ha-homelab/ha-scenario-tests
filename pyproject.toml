[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-scenario-tests"
version = "0.1.1b2"
description = "Bounded synthetic scenarios executed by a real, isolated Home Assistant engine"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = ["homeassistant==2026.10.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.2"]

[project.scripts]
ha-scenario = "ha_scenario_tests.cli:main"

[project.entry-points.pytest11]
ha_scenario = "ha_scenario_tests.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["runtime: executes the pinned real Home Assistant runtime"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
