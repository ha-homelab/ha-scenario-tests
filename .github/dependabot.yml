version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # CodeQL init, autobuild, analyze and SARIF upload share one release.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Python minor/major migrations must update the supported HA runtime and lock
    # together. Keep patch releases and refreshed image digests enabled.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
