name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@e71559f44e41f39ad0037bf13c7f43bbbb2ec9af # main
    with:
      force-full: false
      # README.md is semantic package metadata; ordinary archive copies remain documentation-scoped.
      required-paths: '["README.md"]'
      documentation-paths: "[\"GOVERNANCE.md\", \"README.de.md\", \"README.es.md\", \"README.ru.md\", \"ROADMAP.md\", \"wiki/Home.ar.md\", \"wiki/Home.bn.md\", \"wiki/Home.cs.md\", \"wiki/Home.de.md\", \"wiki/Home.es.md\", \"wiki/Home.fa.md\", \"wiki/Home.fr.md\", \"wiki/Home.he.md\", \"wiki/Home.hi.md\", \"wiki/Home.id.md\", \"wiki/Home.it.md\", \"wiki/Home.ja.md\", \"wiki/Home.ko.md\", \"wiki/Home.md\", \"wiki/Home.nl.md\", \"wiki/Home.pl.md\", \"wiki/Home.pt.md\", \"wiki/Home.ru.md\", \"wiki/Home.th.md\", \"wiki/Home.tr.md\", \"wiki/Home.uk.md\", \"wiki/Home.vi.md\", \"wiki/Home.zh-Hans.md\", \"wiki/Home.zh-Hant.md\", \"wiki/_Sidebar.md\"]"
  validation:
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install package and validation tools
        run: |
          python3 tools/check_lock.py
          python3 -m pip install --require-hashes -r requirements.lock -r requirements-build.lock
          python3 -m pip install --no-index --no-deps --no-build-isolation .
          python3 -m pip check
      - name: Validate source, examples and translations
        run: |
          python3 -m ruff check --select E4,E7,E9,F src tests tools
          python3 -m pytest -q
          python3 tools/check_docs.py
          python3 -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          python3 tools/check_package.py "$RUNNER_TEMP/dist"
      - name: Verify the built wheel in a fresh environment
        run: |
          python3 -m venv "$RUNNER_TEMP/wheel-venv"
          wheel_python="$RUNNER_TEMP/wheel-venv/bin/python"
          "$wheel_python" -m pip install --require-hashes -r requirements.lock
          "$wheel_python" -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          "$wheel_python" -m pip check
          cd "$RUNNER_TEMP"
          "$wheel_python" -m pytest -q -m runtime "$GITHUB_WORKSPACE/tests/test_scenarios.py"
      - name: Hash the accepted package files
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum -- *.tar.gz *.whl > SHA256SUMS
      - name: Build and exercise the packaged runtime
        run: |
          docker build --tag ha-scenario-ci .
          docker run --rm --network none --read-only --tmpfs /tmp:rw \
            --cap-drop ALL --security-opt no-new-privileges ha-scenario-ci
      - name: Preserve accepted release candidate bytes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose pinned runtime with synthetic input only
        if: failure()
        run: python3 -X faulthandler -I -m ha_scenario_tests.worker < examples/presence_timeout.json
  check:
    name: check
    needs: [scope, validation]
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Require the selected validation path
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if set(results) != {'scope', 'validation'}:
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          expected = 'success' if run == 'true' else 'skipped'
          if results['validation']['result'] != expected:
              raise SystemExit('Selected validation did not pass')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation without installing the application
        run: python3 tools/check_docs.py
  secrets:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/publication_check.py
      - name: Install verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow --no-banner'
