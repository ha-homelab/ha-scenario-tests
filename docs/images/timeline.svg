<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="625" viewBox="0 0 1120 625" role="img" aria-labelledby="title desc"><title id="title">Synthetic expected presence timeout timeline</title><desc id="desc">Presence starts at 0.04 seconds and ends at 0.08 seconds. The expected lamp off action is after a 0.12 second HA timer. This is synthetic expected behavior, not measured runtime.</desc><rect width="1120" height="625" fill="#0b1725"/><text x="40" y="48" font-family="sans-serif" font-size="28" font-weight="600" fill="#dfebf6">Presence → absence hold → light off</text><text x="40" y="78" font-family="sans-serif" font-size="17" font-weight="400" fill="#97bed8">Synthetic expected timeline from examples/presence_timeout.json</text><text x="40" y="111" font-family="sans-serif" font-size="16" font-weight="400" fill="#ffcc85">Illustration, not measured runtime or proof of a production timer</text><path d="M210.0 165 V370" stroke="#33475b" stroke-dasharray="5 5"/><text x="192.0" y="405" font-family="sans-serif" font-size="15" font-weight="400" fill="#dfebf6">0.00s</text><path d="M320.67 165 V370" stroke="#33475b" stroke-dasharray="5 5"/><text x="302.67" y="405" font-family="sans-serif" font-size="15" font-weight="400" fill="#dfebf6">0.04s</text><path d="M431.33 165 V370" stroke="#33475b" stroke-dasharray="5 5"/><text x="413.33" y="405" font-family="sans-serif" font-size="15" font-weight="400" fill="#dfebf6">0.08s</text><path d="M763.33 165 V370" stroke="#33475b" stroke-dasharray="5 5"/><text x="745.33" y="405" font-family="sans-serif" font-size="15" font-weight="400" fill="#dfebf6">0.20s</text><path d="M1040.0 165 V370" stroke="#33475b" stroke-dasharray="5 5"/><text x="1022.0" y="405" font-family="sans-serif" font-size="15" font-weight="400" fill="#dfebf6">0.30s</text><text x="40" y="207" font-family="sans-serif" font-size="22" font-weight="600" fill="#dfebf6">Presence</text><path d="M210 220 H320.67 V180 H431.33 V220 H1040" fill="none" stroke="#63d6ba" stroke-width="5"/><text x="40" y="287" font-family="sans-serif" font-size="22" font-weight="600" fill="#dfebf6">Light</text><path d="M210 300 H320.67 V260 H763.33 V300 H1040" fill="none" stroke="#63d6ba" stroke-width="5"/><text x="327.67" y="163" font-family="sans-serif" font-size="16" font-weight="400" fill="#63d6ba">on</text><text x="438.33" y="163" font-family="sans-serif" font-size="16" font-weight="400" fill="#63d6ba">off</text><text x="770.33" y="255" font-family="sans-serif" font-size="16" font-weight="400" fill="#63d6ba">turn_off</text><path d="M431.33 335 H763.33" stroke="#ffcc85" stroke-width="5"/><text x="441.33" y="365" font-family="sans-serif" font-size="17" font-weight="400" fill="#ffcc85">HA for: 0.12s</text><rect x="40" y="445" width="1040" height="145" rx="14" fill="#20322f" stroke="#47657c"/><text x="60" y="478" font-family="sans-serif" font-size="20" font-weight="600" fill="#dfebf6">Assertions</text><text x="60" y="510" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Exact ordered service calls: light.turn_on, then light.turn_off.</text><text x="60" y="536" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Final synthetic light state: off. Actual execution reports elapsed timestamps.</text><text x="60" y="562" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Real elapsed clock. Reload, manual override and stale input have own scenarios.</text></svg>
