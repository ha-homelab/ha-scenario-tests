<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc"><title id="title">Synthetic HA scenario isolation architecture</title><desc id="desc">A bounded scenario enters a fresh guarded Python worker running actual Home Assistant. Synthetic callbacks record ordered calls and states. A temporary config is used. The audit guard is not an OS sandbox.</desc><rect width="1120" height="710" fill="#0b1725"/><text x="40" y="48" font-family="sans-serif" font-size="28" font-weight="600" fill="#dfebf6">Actual HA engine · synthetic inputs and actuators</text><text x="40" y="78" font-family="sans-serif" font-size="17" font-weight="400" fill="#97bed8">Architecture illustration — no live Home Assistant connection</text><rect x="40" y="120" width="265" height="170" rx="14" fill="#163149" stroke="#47657c"/><text x="60" y="153" font-family="sans-serif" font-size="20" font-weight="600" fill="#dfebf6">Bounded JSON</text><text x="60" y="185" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Seed + state/event timeline</text><text x="60" y="211" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Allowed HA automation subset</text><text x="60" y="237" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Expected / forbidden calls</text><rect x="355" y="120" width="355" height="170" rx="14" fill="#163149" stroke="#47657c"/><text x="375" y="153" font-family="sans-serif" font-size="20" font-weight="600" fill="#dfebf6">Fresh Python worker</text><text x="375" y="185" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Home Assistant 2026.10.3</text><text x="375" y="211" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Real triggers, timers and reload</text><text x="375" y="237" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">In-memory actuator callbacks</text><rect x="760" y="120" width="320" height="170" rx="14" fill="#163149" stroke="#47657c"/><text x="780" y="153" font-family="sans-serif" font-size="20" font-weight="600" fill="#dfebf6">Evidence</text><text x="780" y="185" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Ordered calls and final states</text><text x="780" y="211" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Stable JSON report + pytest</text><text x="780" y="237" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Physical validation: false</text><rect x="355" y="335" width="355" height="145" rx="14" fill="#163149" stroke="#47657c"/><text x="375" y="368" font-family="sans-serif" font-size="20" font-weight="600" fill="#dfebf6">Temporary configuration</text><text x="375" y="400" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">No existing config directory</text><text x="375" y="426" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">No custom integrations or tokens</text><rect x="40" y="525" width="1040" height="145" rx="14" fill="#20322f" stroke="#47657c"/><text x="60" y="558" font-family="sans-serif" font-size="20" font-weight="600" fill="#dfebf6">Execution boundary</text><text x="60" y="590" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Python audit guard: block network / DNS / subprocess attempts; fail the scenario.</text><text x="60" y="616" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Trusted native dependencies: this is not an OS security sandbox.</text><text x="60" y="642" font-family="sans-serif" font-size="16" font-weight="400" fill="#dfebf6">Optional Docker --network none provides a separate OS network boundary.</text><path d="M305 200 H347 l-10 -6 m10 6 l-10 6" fill="none" stroke="#63d6ba" stroke-width="3"/><path d="M710 200 H752 l-10 -6 m10 6 l-10 6" fill="none" stroke="#63d6ba" stroke-width="3"/><path d="M532 335 V300 l-6 10 m6 -10 l6 10" fill="none" stroke="#63d6ba" stroke-width="3"/></svg>
